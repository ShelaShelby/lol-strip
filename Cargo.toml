[package]
name = "lol-strip"
version = "0.1.0"
edition = "2021"
description = "Taskbar strip + tray app showing the next League of Legends esports matches"
license = "MIT"

[dependencies]
fontdue = "0.9.5"
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_Networking_WinHttp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
codegen-units = 1
