name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Unit tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Preview PNGs
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\release\lol-strip.exe'
          $out = Join-Path $PWD 'preview'
          $p = Start-Process -FilePath $exe -ArgumentList @('--preview', $out) -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "preview failed with exit code $($p.ExitCode)" }
          foreach ($f in 'preview-light.png', 'preview-dark.png') {
            if (-not (Test-Path (Join-Path $out $f))) { throw "missing $f" }
          }

      # Live check of the data sources from a real Windows machine. Never fails the build.
      - name: Live probe (lolesports + Leaguepedia)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\release\lol-strip.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--probe', '--no-dialog') -Wait -PassThru -NoNewWindow
          Write-Host "probe exit code: $($p.ExitCode)"
          Get-Content (Join-Path $PWD 'target\release\probe.txt')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lol-strip
          path: |
            target/release/lol-strip.exe
            target/release/probe.txt
            preview/*.png

      - name: Publish release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          gh release create latest target/release/lol-strip.exe \
            --target "$GITHUB_SHA" \
            --title "LoL Strip (latest build)" \
            --notes "Automated build of ${GITHUB_SHA}. Unsigned exe: Windows SmartScreen may warn, click More info > Run anyway. Run with --probe to check the data sources (probe.txt next to the exe)." \
            --latest
          gh release view latest --json tagName,targetCommitish,assets
